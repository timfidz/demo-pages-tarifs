<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tarifs épilation laser – maquette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #f00069;
    --rose-pale: #fff0f6;
    --encre: #251f13;
    --gris: #6b6559;
    --trait: #ebe6df;
    --fond: #fbf9f6;
    --blanc: #ffffff;
    --rayon: 14px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 130px; }
  body { margin: 0; background: var(--fond); color: var(--encre); font: 16px/1.55 "Nunito Sans", system-ui, sans-serif; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; letter-spacing: -.01em; margin: 0; }

  .bandeau { background: var(--encre); color: #fff; font-size: 13px; text-align: center; padding: 8px 16px; }

  .entete { max-width: 1120px; margin: 0 auto; padding: 48px 24px 24px; }
  .entete h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; }
  .entete p { color: var(--gris); max-width: 620px; margin: 12px 0 0; }

  .choix { display: inline-flex; background: var(--blanc); border: 1px solid var(--trait); border-radius: 999px; padding: 4px; margin-top: 24px; }
  .choix button { border: 0; background: none; font: 600 15px "Nunito Sans", sans-serif; color: var(--gris); padding: 10px 26px; border-radius: 999px; cursor: pointer; }
  .choix button[aria-selected="true"] { background: var(--encre); color: #fff; }

  .formules { max-width: 1120px; margin: 0 auto; padding: 8px 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .formule { background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 16px 18px; }
  .formule b { display: block; font-size: 15px; }
  .formule span { color: var(--gris); font-size: 14px; }
  .formule.phare { border-color: var(--rose); box-shadow: 0 0 0 1px var(--rose) inset; }
  .formule .remise { float: right; font-size: 12px; font-weight: 700; color: var(--rose); background: var(--rose-pale); border-radius: 999px; padding: 2px 9px; }

  .populaires { max-width: 1120px; margin: 0 auto; padding: 28px 24px 0; }
  .populaires h2 { font-size: 22px; margin-bottom: 12px; }
  .cartes { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .carte { flex: 0 0 auto; background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 12px 16px; min-width: 170px; }
  .carte span { display: block; font-size: 14px; color: var(--gris); }
  .carte b { font-size: 18px; }
  .carte small { color: var(--gris); }

  .nav { position: sticky; top: 0; z-index: 5; background: rgba(251, 249, 246, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--trait); margin-top: 32px; }
  .nav div { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .nav a { flex: 0 0 auto; text-decoration: none; color: var(--encre); font-size: 14px; font-weight: 600; border: 1px solid var(--trait); background: var(--blanc); border-radius: 999px; padding: 7px 15px; }
  .nav a.actif { background: var(--rose); border-color: var(--rose); color: #fff; }

  main { max-width: 1120px; margin: 0 auto; padding: 8px 24px 40px; }
  section { padding-top: 36px; }
  section h2 { font-size: 28px; margin-bottom: 14px; }

  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--rayon); overflow: hidden; }
  th, td { padding: 13px 18px; text-align: right; border-bottom: 1px solid var(--trait); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  @media (min-width: 761px) { table { table-layout: fixed; } thead th:first-child { width: 42%; } }
  tbody tr:last-child td { border-bottom: 0; }
  thead th { font-size: 13px; font-weight: 700; color: var(--gris); background: #f6f3ee; vertical-align: bottom; }
  thead th small { display: block; font-weight: 400; }
  tbody tr:hover td { background: #fdf8f3; }
  td.zone { font-weight: 600; }
  td.unite { font-weight: 700; }
  .col-phare { background: var(--rose-pale); }
  thead .col-phare { color: var(--rose); background: #ffe3ef; }
  tbody tr:hover td.col-phare { background: #ffe9f2; }
  td.vide { color: #c4bdb2; }

  .note { font-size: 13px; color: var(--gris); margin: 10px 2px 0; }

  .rdv { margin-top: 48px; background: var(--encre); color: #fff; border-radius: var(--rayon); padding: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .rdv h2 { font-size: 26px; }
  .rdv p { margin: 6px 0 0; color: #d8d2c8; }
  .bouton { display: inline-block; background: var(--rose); color: #fff; text-decoration: none; font-weight: 700; border-radius: 999px; padding: 13px 26px; }

  /* Téléphone : chaque ligne devient une carte */
  @media (max-width: 760px) {
    .entete { padding: 32px 16px 16px; }
    .formules, .populaires, main { padding-left: 16px; padding-right: 16px; }
    .nav div { padding: 10px 16px; }
    .formules { grid-template-columns: 1fr 1fr; gap: 8px; }
    .formule { padding: 12px 14px; }
    .formule .remise { float: none; display: inline-block; margin-bottom: 4px; }
    .formule span { font-size: 13px; }
    section h2 { font-size: 24px; }
    table, thead, tbody, tr, td { display: block; }
    table { background: none; border: 0; border-radius: 0; }
    thead { display: none; }
    tbody tr { background: var(--blanc); border: 1px solid var(--trait); border-radius: var(--rayon); margin-bottom: 10px; padding: 14px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    tbody tr:hover td, tbody tr:hover td.col-phare { background: none; }
    td { border: 0; padding: 0; text-align: left; }
    td.zone { grid-column: 1 / 3; font-size: 16px; }
    td.unite { grid-column: 3 / 4; text-align: right; font-size: 18px; white-space: nowrap; }
    td.unite::before { content: "la séance"; display: block; font-size: 11px; font-weight: 400; color: var(--gris); }
    td:not(.zone):not(.unite) { font-size: 14px; background: #f6f3ee; border-radius: 8px; padding: 6px 10px; }
    td:not(.zone):not(.unite)::before { content: attr(data-label); display: block; font-size: 11px; color: var(--gris); }
    td.col-phare { background: var(--rose-pale); }
    td.vide { display: none; }
    .rdv { padding: 22px; }
  }
</style>
</head>
<body>

<div class="bandeau">Maquette de proposition : ce n'est pas le site officiel. Tarifs repris des pages publiques le 30/09/2026.</div>

<header class="entete">
  <h1 id="titre">Tarifs épilation laser à Paris</h1>
  <p id="chapeau"></p>
  <div class="choix" role="tablist">
    <button role="tab" data-public="femme">Femme</button>
    <button role="tab" data-public="homme">Homme</button>
  </div>
</header>

<div class="formules" id="formules"></div>
<div class="populaires" id="populaires"></div>
<nav class="nav"><div id="nav"></div></nav>
<main>
  <div id="grilles"></div>
  <div class="rdv">
    <div>
      <h2>Un doute sur les zones à traiter ?</h2>
      <p>Une conseillère établit votre protocole et votre budget, en visio ou au centre.</p>
    </div>
    <a class="bouton" href="#" onclick="return false">Prendre rendez-vous</a>
  </div>
</main>

<script>
// Tarifs TTC par séance : [zone, unité, forfait 4+1, forfait 6+2, mensualité] (null = pas proposé)
const DONNEES = {
  femme: {
    chapeau: "Payez à la séance, prenez un forfait pour réduire le prix de chaque séance, ou étalez votre protocole en 18 mensualités.",
    mensualites: true,
    populaires: [
      ["Lèvre supérieure", 12], ["Menton", 12], ["Lèvre + menton", 20], ["Aisselles", 20],
      ["Avant-bras", 23], ["Maillot brésilien", 30], ["1/2 jambes complètes", 53],
      ["1/2 jambes + maillot brésilien + aisselles", 95]
    ],
    note: "* 18 mensualités : exemple de répartition sur un protocole de 6 séances réalisées tous les 3 mois. Prix TTC.",
    grilles: [
      ["visage", "Visage", [
        ["Lèvre supérieure", 36, 29, 27, 12], ["Menton", 36, 29, 27, 12], ["Haut des favoris", 36, 29, 27, 12],
        ["Bas des favoris", 36, 29, 27, 12], ["Mandibules", 36, 29, 27, 12], ["Zone sous mentonnière", 36, 29, 27, 12],
        ["Cou ou nuque", 60, 48, 45, 20], ["Visage, 2 zones", 60, 48, 45, 20], ["Visage, 3 zones", 84, 67, 63, 28],
        ["Visage, 4 zones", 90, 72, 68, 30], ["Visage entier (5 zones)", 120, 96, 90, 40],
        ["Bleaching visage entier", 120, 96, 90, 40], ["Inter-sourcils", 90, null, null, null]
      ]],
      ["corps", "Corps", [
        ["Aisselles", 60, 48, 45, 20], ["Maillot classique", 60, 48, 45, 20], ["Maillot brésilien", 90, 72, 68, 30],
        ["Maillot complet / intégral", 136, 109, 102, 45], ["Fesses + SIF", 119, 95, 89, 40],
        ["1/2 jambes complètes", 160, 128, 120, 53], ["Cuisses complètes", 190, 152, 143, 63],
        ["Demi-cuisses", 110, 88, 83, 37], ["Jambes complètes", 326, 261, 245, 109], ["Avant-bras", 76, 61, 57, 25],
        ["2/3 bras", 96, 77, 72, 32], ["Bras entiers hors épaules", 126, 101, 95, 42], ["SIF seul", 60, 48, 45, 20],
        ["Genoux seuls", 60, 48, 45, 20], ["Pieds seuls", 60, 48, 45, 20], ["Fesses hors SIF", 90, 72, 68, 30]
      ]],
      ["multizones", "Multizones", [
        ["Maillot classique + aisselles", 69, 55, 52, 23], ["Maillot brésilien + aisselles", 126, 101, 95, 42],
        ["Maillot complet + aisselles", 172, 138, 129, 57], ["1/2 jambes + maillot classique + aisselles", 229, 183, 172, 76],
        ["1/2 jambes + maillot brésilien + aisselles", 286, 229, 215, 95], ["1/2 jambes + maillot complet + aisselles", 332, 266, 249, 111],
        ["Jambes complètes + maillot classique + aisselles", 392, 314, 294, 131],
        ["Jambes complètes + maillot complet + aisselles", 498, 398, 374, 166],
        ["Jambes complètes + maillot complet + aisselles + avant-bras", 574, 459, 431, 191]
      ]]
    ]
  },
  homme: {
    chapeau: "Payez à la séance, ou prenez un forfait pour réduire le prix de chaque séance.",
    mensualites: false,
    populaires: null,
    note: "Une extension est une zone ajoutée à une zone déjà traitée ou en cours de traitement. Prix TTC.",
    grilles: [
      ["visage", "Visage", [
        ["Nez / favoris / pommettes / oreilles", 60, 48, 45], ["Pommettes strictes", 60, 48, 45], ["ZIS", 60, 48, 45],
        ["Pommettes + dessin de barbe", 96, 77, 72], ["Collier de barbe", 96, 77, 72], ["Barbe complète", 120, 96, 90],
        ["Nuque ou FAC", 60, 48, 45], ["Tour de cou", 120, 96, 90]
      ]],
      ["dos", "Dos", [
        ["Dos complet hors épaules", 240, 192, 180], ["Dos + épaules + dégradé bras", 300, 240, 225],
        ["Dos + épaules + dégradé + avant-bras", 388, 310, 291], ["Dos + épaules + bras complets", 456, 365, 342],
        ["Dos + épaules + torse + abdomen", 468, 374, 351], ["Dos + épaules + torse + abdomen + bras entiers", 646, 517, 485]
      ]],
      ["maillot", "Maillot et fesses", [
        ["Maillot classique", 72, 58, 54], ["Pubis (tour parties génitales)", 96, 77, 72], ["Parties génitales", 96, 77, 72],
        ["Maillot complet (pubis + génitales + SIF)", 180, 144, 135], ["Fesses + SIF", 180, 144, 135],
        ["Fesses + SIF + pubis + génitales", 372, 298, 279]
      ]],
      ["torse", "Torse", [
        ["Torse", 92, 74, 69], ["Abdomen", 92, 74, 69], ["Torse + abdomen ceinture", 192, 154, 144],
        ["Torse + abdomen jusqu'au pubis", 228, 182, 171], ["Torse + épaules + dégradé haut bras", 240, 192, 180],
        ["Torse + abdomen + maillot complet", 368, 294, 276], ["Torse + abdomen + épaules + bras complets", 420, 336, 315]
      ]],
      ["jambes", "Jambes", [
        ["Demi-jambes", 240, 192, 180], ["Cuisses", 300, 240, 225], ["Abdomen + maillot complet + fesses", 408, 326, 306],
        ["Jambes complètes", 478, 382, 359], ["Membres inférieurs + fesses + maillot classique", 676, 541, 507],
        ["Membres inférieurs + fesses + hanches + maillot complet", 802, 642, 602], ["Corps entier (hors nuque et cou)", 1024, 819, 768]
      ]],
      ["extensions", "Extensions de zone", [
        ["Col de chemise", 48, 38, 36], ["Aisselles", 72, 58, 54], ["Sommet strict épaules", 60, 48, 45], ["SIF", 60, 48, 45],
        ["Hanches", 60, 48, 45], ["Épaules", 96, 77, 72], ["Membres supérieurs (hors épaules)", 180, 144, 135],
        ["Extension dégradé haut des cuisses", 60, 48, 45]
      ]]
    ]
  }
};

const prix = v => v == null ? "–" : v.toLocaleString("fr-FR") + " €";
const echapper = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function afficher(publicVise) {
  const d = DONNEES[publicVise];
  document.querySelectorAll(".choix button").forEach(b => b.setAttribute("aria-selected", b.dataset.public === publicVise));
  document.getElementById("titre").textContent = "Tarifs épilation laser " + publicVise + " à Paris";
  document.getElementById("chapeau").textContent = d.chapeau;

  let formules = `
    <div class="formule"><b>Séance à l'unité</b><span>Vous payez chaque séance quand vous la faites.</span></div>
    <div class="formule"><span class="remise">−20 %</span><b>Forfait 4+1</b><span>5 séances pour le prix de 4.</span></div>
    <div class="formule phare"><span class="remise">−25 %</span><b>Forfait 6+2</b><span>8 séances pour le prix de 6. Le prix par séance le plus bas.</span></div>`;
  if (d.mensualites) formules += `<div class="formule"><b>18 mensualités</b><span>Votre protocole de 6 séances, étalé sur 18 mois.</span></div>`;
  document.getElementById("formules").innerHTML = formules;

  document.getElementById("populaires").innerHTML = d.populaires ? `
    <h2>Les zones les plus demandées</h2>
    <div class="cartes">${d.populaires.map(([z, m]) => `<div class="carte"><span>${echapper(z)}</span><small>à partir de </small><b>${m} €</b><small> / mois*</small></div>`).join("")}</div>` : "";

  document.getElementById("nav").innerHTML = d.grilles.map(([id, nom]) => `<a href="#${id}" data-cible="${id}">${nom}</a>`).join("");

  const entetes = `<th>Zone</th><th>Séance à l'unité</th><th>Forfait 4+1<small>par séance</small></th><th class="col-phare">Forfait 6+2<small>par séance</small></th>` +
    (d.mensualites ? `<th>Mensualités*<small>sur 18 mois</small></th>` : "");
  document.getElementById("grilles").innerHTML = d.grilles.map(([id, nom, lignes]) => `
    <section id="${id}">
      <h2>${nom}</h2>
      <table>
        <thead><tr>${entetes}</tr></thead>
        <tbody>${lignes.map(l => `<tr>
          <td class="zone">${echapper(l[0])}</td>
          <td class="unite">${prix(l[1])}</td>
          <td data-label="Forfait 4+1" class="${l[2] == null ? "vide" : ""}">${prix(l[2])}</td>
          <td data-label="Forfait 6+2" class="col-phare ${l[3] == null ? "vide" : ""}">${prix(l[3])}</td>
          ${d.mensualites ? `<td data-label="Mensualités*" class="${l[4] == null ? "vide" : ""}">${l[4] == null ? "–" : prix(l[4]) + " / mois"}</td>` : ""}
        </tr>`).join("")}</tbody>
      </table>
    </section>`).join("") + `<p class="note">${d.note}</p>`;

  suivreSections();
}

// La pastille de la section visible s'allume pendant le défilement
let observateur;
function suivreSections() {
  if (observateur) observateur.disconnect();
  observateur = new IntersectionObserver(entrees => {
    entrees.forEach(e => {
      if (!e.isIntersecting) return;
      document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("actif", a.dataset.cible === e.target.id));
      const actif = document.querySelector(".nav a.actif");
      if (actif) actif.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
  }, { rootMargin: "-140px 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => observateur.observe(s));
}

document.querySelectorAll(".choix button").forEach(b => b.addEventListener("click", () => {
  history.replaceState(null, "", "?public=" + b.dataset.public);
  afficher(b.dataset.public);
}));

afficher(new URLSearchParams(location.search).get("public") === "homme" ? "homme" : "femme");
</script>
</body>
</html>
